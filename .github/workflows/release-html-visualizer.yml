name: Release HTML Visualizer

on:
  push:
    tags:
      - "html-visualizer-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a Release for (e.g. html-visualizer-v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node skills/html-visualizer/scripts/validate.mjs

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          notes="skills/html-visualizer/RELEASE_NOTES/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "missing release notes: $notes" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes" --title "HTML Visualizer ${TAG#html-visualizer-}"
          else
            gh release create "$TAG" --notes-file "$notes" --title "HTML Visualizer ${TAG#html-visualizer-}"
          fi
