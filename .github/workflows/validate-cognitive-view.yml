name: Validate Cognitive View

on:
  pull_request:
    paths:
      - "skills/cognitive-view/**"
      - ".github/workflows/validate-cognitive-view.yml"
  push:
    branches: [main]
    paths:
      - "skills/cognitive-view/**"
      - ".github/workflows/validate-cognitive-view.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node skills/cognitive-view/scripts/validate.mjs
