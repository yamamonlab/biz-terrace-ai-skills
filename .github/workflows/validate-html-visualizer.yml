name: Validate HTML Visualizer

on:
  pull_request:
    paths:
      - "skills/html-visualizer/**"
      - ".github/workflows/validate-html-visualizer.yml"
  push:
    branches: [main]
    paths:
      - "skills/html-visualizer/**"
      - ".github/workflows/validate-html-visualizer.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node skills/html-visualizer/scripts/validate.mjs
